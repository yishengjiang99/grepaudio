<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GrepAudio PWA">
  <meta name="description" content="dsp over webrtc">
  <meta name="theme-color" content="#2F3BA2" />
  <link rel="apple-touch-icon" href="/images/icon-152.png">
  <title>rttt</title>
  <link rel="stylesheet" href="style.css">
  <script src="./simple-console.js"></script>
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"
    integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="./simple-console.css">
</head>

<body>
  <div class="container-fluid">
    <div class="row">
      <nav class="sidebar">
        <div id="ctrls" class="nav flex-column w-100"></div>
        <div class="mt-2 w-100">
          <label class="small">Load file</label>
          <input id="file" type="file" class="form-control-file" accept="audio/*" />
        </div>
      </nav>
      <main>
        <h4 id="std1">Mix Sounds</h4>
        <button id="cplink" style="display:none" onclick="copylink()">copy</button>
        <div id="chart" class="wrapper">
          <span id="status"></span>
          <canvas class="layer1" width="100" height="100" style="position:absolute;left:0;top:0;z-index:1;"></canvas>
          <canvas id="layer2" class="layer2" width="100" height="100" style="position:absolute;left:0;top:0;z-index:0;"></canvas>
          <canvas id="output_timeline" style="position:absolute;left:0;width:100%;top:100%;height:40%;z-index:0;"></canvas>
        </div>
        <figure class="well" style="margin-top:16px">
          <span id="rx0"></span>
          <span id="rx1"></span>
          <figcaption class="figure-caption">PCM 32bit sample</figcaption>
        </figure>
        <div class="d-block p-2" id="eq_update_form"></div>
        <div class="canvas_wrapper">
          <div class="btn-group mr-2">
            <button id="zoomin" type="button" class="btn btn-sm btn-outline-secondary">+</button>
            <button id="zoomout" type="button" class="btn btn-sm btn-outline-secondary">-</button>
          </div>
          <figure class="well" style="display:none"><canvas id="output_freq"></canvas></figure>
          <figure class="well" style="display:none"><canvas id="band_freq_out"></canvas></figure>
        </div>
        <div id="output_cp" class="footer">
          <button id="recorder" class="btn btn-sm btn-outline-light">Start Recording</button>
          <span id="rinfo"></span>
          <span id="rdownload"></span>
          <div class="range-wrap" style="margin-top:8px">
            <video width="320" id="rtc" controls playsinline style="max-width:100%"></video>
            <audio width="320" id="audio2" controls playsinline src="./samples/song.mp3" style="max-width:100%"></audio>
            <audio width="320" id="audio1" controls playsinline src="./samples/song.mp3" style="max-width:100%"></audio>
            <output id="threshold_l">Noise Gate: </output>
            <input aria-labelledby="threshold_l" type="range" min="-100" max="0" value="-80" class="range" name="threshold">
          </div>
        </div>
      </main>
    </div>
  </div>
  <div id="console"></div>
  <div id="rx2log"></div>
  <script id="mix_input" type="text/x-handlebars-template">
      <div class="ProfileCard u-cf">
        <img class="ProfileCard-avatar" src="{{thumbnail}}">
        <div class="ProfileCard-details">
          <div class="ProfileCard-realName">{{title}}</div>
          <div class="ProfileCard-screenName">{{channelTitle}}</div>
          <div class="ProfileCard-description">{{description}}</div>
        </div>
      </div>
   </script>
  <script id="result-template" type="text/x-handlebars-template">
      <div class="ProfileCard u-cf">
        <img class="ProfileCard-avatar" src="{{thumbnail}}">
        <div class="ProfileCard-details">
          <div class="ProfileCard-realName">{{title}}</div>
          <div class="ProfileCard-screenName">{{channelTitle}}</div>
          <div class="ProfileCard-description">{{description}}</div>
        </div>
      </div>
   </script>
  <script src="polyfills.js"></script>
  <script type="module" src="./index.js"></script>
</body>
</html>
