<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="GrepAudio">
  <meta name="description" content="dsp over webrtc">
  <meta name="theme-color" content="#0f1115" />
  <title>GrepAudio</title>
  <link rel="stylesheet" href="style.css">
  <script src="./simple-console.js"></script>
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"
    integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="./simple-console.css">
</head>

<body>
  <div class="container-fluid">
    <div class="row">
      <nav class="sidebar">
        <h5>Sources</h5>
        <div id="ctrls" class="nav flex-column w-100"></div>
        <div class="file-row">
          <label>Load local file</label>
          <input id="file" type="file" accept="audio/*" />
        </div>
      </nav>
      <main>
        <h4 id="std1">Mix</h4>
        <button id="cplink" style="display:none" onclick="copylink()">copy</button>
        <div id="chart" class="wrapper">
          <span id="status"></span>
          <canvas class="layer1" width="100" height="100" style="position:absolute;left:0;top:0;z-index:1;"></canvas>
          <canvas id="layer2" class="layer2" width="100" height="100" style="position:absolute;left:0;top:0;z-index:0;"></canvas>
          <canvas id="output_timeline" style="position:absolute;left:0;width:100%;top:100%;height:40%;z-index:0;"></canvas>
        </div>
        <figure class="well" style="margin:8px 0 12px;color:#9aa0a6;font-size:12px">
          <span id="rx0"></span>
          <span id="rx1"></span>
          <figcaption>PCM</figcaption>
        </figure>
        <div id="eq_update_form"></div>
        <div class="canvas_wrapper" style="margin-bottom:12px">
          <button id="zoomin" type="button">+</button>
          <button id="zoomout" type="button">-</button>
          <figure class="well" style="display:none"><canvas id="output_freq"></canvas></figure>
          <figure class="well" style="display:none"><canvas id="band_freq_out"></canvas></figure>
        </div>
        <div id="output_cp" class="footer">
          <button id="recorder">Start Recording</button>
          <span id="rinfo" style="margin-left:8px;font-size:12px;color:#9aa0a6"></span>
          <span id="rdownload" style="margin-left:8px"></span>
          <div class="range-wrap" style="margin-top:10px">
            <video width="320" id="rtc" controls playsinline style="max-width:100%;border-radius:6px"></video>
            <audio width="320" id="audio2" controls playsinline src="./samples/song.mp3" style="max-width:100%;margin-top:6px"></audio>
            <audio width="320" id="audio1" controls playsinline src="./samples/song.mp3" style="max-width:100%;margin-top:6px"></audio>
            <div style="margin-top:8px;font-size:12px">
              <output id="threshold_l">Noise Gate</output>
              <input aria-labelledby="threshold_l" type="range" min="-100" max="0" value="-80" name="threshold" style="vertical-align:middle;margin-left:8px">
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <div id="console"></div>
  <div id="rx2log"></div>
  <script id="mix_input" type="text/x-handlebars-template">
      <div class="ProfileCard u-cf">
        <img class="ProfileCard-avatar" src="{{thumbnail}}">
        <div class="ProfileCard-details">
          <div class="ProfileCard-realName">{{title}}</div>
          <div class="ProfileCard-screenName">{{channelTitle}}</div>
          <div class="ProfileCard-description">{{description}}</div>
        </div>
      </div>
   </script>
  <script id="result-template" type="text/x-handlebars-template">
      <div class="ProfileCard u-cf">
        <img class="ProfileCard-avatar" src="{{thumbnail}}">
        <div class="ProfileCard-details">
          <div class="ProfileCard-realName">{{title}}</div>
          <div class="ProfileCard-screenName">{{channelTitle}}</div>
          <div class="ProfileCard-description">{{description}}</div>
        </div>
      </div>
   </script>
  <script src="polyfills.js"></script>
  <script type="module" src="./index.js"></script>
</body>
</html>
